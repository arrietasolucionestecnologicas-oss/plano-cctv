$('#b-new1').addEventListener('click',newPlan);
function newPlanAsk(){
  if(state.example||(!state.walls.length&&!state.cams.length)){newPlan();return;}
  mbody.innerHTML='<p class="hint">Vas a borrar el plano actual («'+esc(state.name||'sin nombre')+'», '+state.walls.length+' paredes y '+state.cams.length+' cámaras). Puedes recuperarlo con Deshacer mientras no cierres la app, pero lo más seguro es guardarlo antes en un archivo.</p>'+
    '<div class="row"><button class="btn" id="nc-export">Guardar proyecto (.json)</button><button class="btn dng" id="nc-ok">Borrar y empezar uno nuevo</button><button class="btn" id="nc-cancel">Cancelar</button></div>';
  $('#m-title').textContent='¿Empezar un plano nuevo?';modal.hidden=false;
}
async function saveBlob(blob,filename){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:filename,data:blob});return true;}
  }catch(err){if(err&&err.code==='declined')return false;}
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  return true;
}
function projectText(){return JSON.stringify({app:'plano-cctv',version:FORMAT,exportedAt:new Date().toISOString(),state:state,bgSrc:bgSrc});}
function projectFileName(){
  var nm=(state.name||'plano').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'plano';
  return 'plano-cctv-'+nm+'-'+new Date().toISOString().slice(0,10)+'.json';
}
function exportProject(){
  saveBlob(new Blob([projectText()],{type:'application/json'}),projectFileName()).then(function(ok){if(ok)toast('Proyecto guardado en un archivo.');});
}
function canShareFiles(){
  try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['{}'],'a.json',{type:'application/json'})]}));}catch(e){return false;}
}
async function shareProject(){
  try{
    var fl=new File([projectText()],projectFileName(),{type:'application/json'});
    if(!canShareFiles()){toast('Este equipo no deja compartir archivos desde aquí. Usa «Copiar como texto».',6000);return;}
    await navigator.share({files:[fl],title:'Plano CCTV'});
  }catch(e){if(!e||e.name!=='AbortError')toast('No se pudo compartir. Usa «Copiar como texto».',6000);}
}
function copyText(t,msg){
  var ok=function(){toast(msg,5000);};
  var fb=function(){
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var done=false;try{done=document.execCommand('copy');}catch(_){}
    document.body.removeChild(ta);
    if(done)ok();else toast('No pude copiar. Prueba «Guardar proyecto (.json)».',6000);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}
function copyProject(){copyText(projectText(),'Proyecto copiado como texto. Pégalo en una nota o un mensaje para guardarlo; luego se recupera con «Pegar proyecto».');}
function pasteDialog(){
  mbody.innerHTML='<p class="hint">Pega aquí el texto de un proyecto copiado con «Copiar como texto».</p>'+
    '<textarea id="pj-text" class="fld" rows="8" style="width:100%;font:12px monospace" placeholder="Pega el proyecto aquí"></textarea>'+
    '<div class="row"><button class="btn pri" id="pj-open">Abrir</button><button class="btn" id="pj-cancel">Cancelar</button></div>';
  $('#m-title').textContent='Pegar proyecto';modal.hidden=false;
}
function importText(txt){
  if(typeof txt!=='string'||!txt.trim()){toast('No hay nada que abrir.');return;}
  if(txt.length>MAX_FILE){toast('El archivo es demasiado grande para abrirlo.',6000);return;}
  var o=null;try{o=JSON.parse(txt);}catch(e){}
  var s2=sanitizeState(o&&(o.state||o));
  if(!s2){toast('El archivo no es un proyecto válido de Plano CCTV.',5000);return;}
  var dropped=lastDropped,src=validBgSrc(o&&o.bgSrc),newer=!!(o&&o.version>FORMAT);
  pushHist();
  state=s2;state.example=false;bgSrc=src;if(!src)state.bg=null;loadBg(src);
  sel=null;calibPts=[];$('#banner').hidden=true;$('#pname').value=state.name||'';
  closeModal();afterChange(true);renderPanel();
  toast('Proyecto abierto'+(dropped?' (se omitieron '+dropped+' elementos dañados o sobrantes)':'')+(newer?'. Venía de una versión más nueva: se abrió lo que esta versión entiende':'')+'. El anterior se recupera con Deshacer.',7000);
}
$('#file-json').addEventListener('change',function(){
  var fl=this.files&&this.files[0];this.value='';
  if(!fl)return;
  if(fl.size>MAX_FILE){toast('El archivo es demasiado grande para abrirlo.',6000);return;}
  var rd=new FileReader();
  rd.onload=function(){importText(rd.result);};
  rd.onerror=function(){toast('No pude leer el archivo.');};
  rd.readAsText(fl);
});
$('#file-bg').addEventListener('change',function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=1600,k=Math.min(1,mx/Math.max(im.width,im.height)),cvx=document.createElement('canvas');
      cvx.width=Math.round(im.width*k);cvx.height=Math.round(im.height*k);
      cvx.getContext('2d').drawImage(im,0,0,cvx.width,cvx.height);
      var src;try{src=cvx.toDataURL('image/jpeg',0.78);}catch(_){toast('No pude leer la imagen.');return;}
      pushHist();
      var img2=new Image();img2.onload=function(){
        bgImg=img2;bgSrc=src;
        state.bg={x:0,y:0,w:20,h:20*cvx.height/cvx.width,opacity:0.6};
        afterChange();fit();closeModal();toast('Plano cargado. Calibra la escala en Proyecto.');
      };img2.src=src;
    };
    im.onerror=function(){toast('Ese archivo no es una imagen válida.');};
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
});

/* ---------- Exportar ---------- */
function doExport(){
  var b=contentBounds(true),mg=1.2,bw=(b.x1-b.x0)+2*mg,bh=(b.y1-b.y0)+2*mg;
  var outW=1800,pad=60,planW=outW-2*pad,s=planW/bw,planH=bh*s;
  if(planH>1500){s=1500/bh;planH=1500;planW=bw*s;}
  var rows=state.cams.length,headerH=130,tableH=rows?(60+rows*34):0,legendH=150;
  var outH=Math.round(headerH+planH+tableH+legendH+pad);
  var cvx=document.createElement('canvas');cvx.width=outW;cvx.height=outH;
  var c=cvx.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,outW,outH);
  c.fillStyle=PRINT.text;c.textBaseline='alphabetic';c.textAlign='left';
  c.font="600 40px 'Space Grotesk',"+FONT;c.fillText(state.name||'Plano CCTV',pad,70);
  c.font='500 20px '+FONT;c.fillStyle='#556577';
  c.fillText('Arrieta Soluciones Técnicas (A.S.T.)  ·  '+new Date().toLocaleDateString('es-CO'),pad,102);
  var px0=pad+(outW-2*pad-planW)/2,py0=headerH;
  c.save();c.translate(px0,py0);c.beginPath();c.rect(0,0,planW,planH);c.clip();
  var v={s:s,ox:(-b.x0+mg)*s,oy:(-b.y0+mg)*s};
  drawScene(c,v,PRINT,{W:planW,H:planH,grid:true,labels:true,ui:false,fs:16});
  c.restore();
  c.strokeStyle=PRINT.line;c.lineWidth=2;c.strokeRect(px0,py0,planW,planH);
  var y=py0+planH+50;
  if(rows){
    c.fillStyle=PRINT.text;c.font="600 22px 'Space Grotesk',"+FONT;c.fillText('Cámaras (distancias calculadas, no de ficha)',pad,y);y+=34;
    c.font='500 17px '+FONT;
    state.cams.forEach(function(cam){
      var k=CAT(cam.cat),ln=(cam.lens!=null&&k.lenses[cam.lens])?k.lenses[cam.lens].label+' ':'';
      var ds=[];for(var i=0;i<nBands();i++)ds.push(LEVELS[i].name.slice(0,3)+'. '+fmt(levelDist(cam,LEVELS[i].ppm),1)+' m');
      c.fillStyle=PRINT.cam;c.fillText(cam.name,pad,y);
      c.fillStyle=PRINT.text;
      c.fillText(k.name+'  '+ln+'('+fmt(cam.hfov,0)+'°, '+effPx(cam)+' px)',pad+80,y);
      c.fillText(ds.join('   '),pad+800,y);
      y+=34;
    });
    y+=26;
  }
  c.fillStyle=PRINT.text;c.font="600 22px 'Space Grotesk',"+FONT;c.fillText('Niveles de calidad (IEC EN 62676-4)',pad,y);y+=16;
  var x=pad;
  if(viewMode()==='count'){
    legendItems().forEach(function(it){
      c.fillStyle=it.col;c.globalAlpha=.55;c.fillRect(x,y+4,26,26);c.globalAlpha=1;
      c.fillStyle=PRINT.text;c.font='500 18px '+FONT;c.fillText(it.t,x+36,y+24);x+=330;
    });
  }else for(var i=0;i<nBands();i++){
    var lv=LEVELS[i];c.fillStyle=lv.col;c.globalAlpha=.55;c.fillRect(x,y+4,26,26);c.globalAlpha=1;
    c.fillStyle=PRINT.text;c.font='500 18px '+FONT;c.fillText(lv.name+' ('+fmt(lv.ppm,1)+' píx/m)',x+36,y+24);x+=330;
  }
  y+=60;
  c.font='500 15px '+FONT;c.fillStyle='#556577';
  c.fillText((state.cams.length&&state.cams.every(is3D)?'Cobertura estimada en 3D hacia un objetivo a '+fmt(targetH(),2)+' m; paredes como obstáculos de altura completa. ':state.cams.some(is3D)?'Cobertura estimada: '+state.cams.filter(is3D).length+' de '+state.cams.length+' cámaras en 3D (con altura), el resto en 2D sin altura ni inclinación. ':'Cobertura estimada en 2D, frente a la cámara, sin altura ni inclinación. ')+(state.settings.night?'Condición: noche (limitado al alcance IR). ':'Condición: día. ')+'Grabador: '+(state.settings.recMode==='igual'?'sin límite':state.settings.recPx+' px')+'.',pad,y);
  cvx.toBlob(function(blob){
    if(!blob){toast('No pude crear la imagen.');return;}
    var url=URL.createObjectURL(blob);
    mbody.innerHTML='<img class="prev" src="'+url+'" alt="Vista previa del plano exportado"><p class="note">Si el botón no guarda, mantén presionada la imagen para guardarla.</p><div class="row"><button class="btn pri" id="x-save">Guardar PNG</button></div>';
    $('#m-title').textContent='Imagen del plano';modal.hidden=false;
    $('#x-save').addEventListener('click',async function(){
      try{
        var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
        if(!dl){
          var a=document.createElement('a');a.href=url;a.download='plano-cctv.png';document.body.appendChild(a);a.click();document.body.removeChild(a);
          toast('Imagen descargada. Si no aparece, mantén presionada la imagen.');return;
        }
        await dl.save({filename:'plano-cctv.png',data:blob});toast('Imagen guardada.');
      }catch(err){if(!err||err.code!=='declined')toast('No se pudo guardar. Mantén presionada la imagen.');}
    });
  },'image/png');
}
$('#b-export').addEventListener('click',doExport);

/* ---------- Utilidades y arranque ---------- */
var toastT=0;
function toast(t,ms){var el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},ms||2600);}
function resize(){
  var st=$('#stage'),r=st.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,3);
  var nw=Math.round(r.width),nh=Math.round(r.height);
  if(nw===W&&nh===H)return;
  var first=!W;
  var dw=nw-W,dh=nh-H;
  W=nw;H=nh;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(first&&!fitted){fitted=true;fit();}
  else{view.ox+=dw/2;view.oy+=dh/2;redraw();}
}
if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));
window.addEventListener('resize',resize);
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/*PWA-INI*/
/* Instalación como app: aviso con botón «Instalar» (Chrome, Edge, Android), instrucciones en iPhone y service worker para abrir sin internet. */
var deferredInstall=null,INSTALL_KEY=KEY+'-instalar-no';
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installDismissed(){try{return Date.now()-parseInt(localStorage.getItem(INSTALL_KEY)||'0',10)<7*864e5;}catch(e){return false;}}
function showInstall(msg,withBtn){var b=$('#install');if(!b)return;$('#install-t').textContent=msg;$('#install-go').hidden=!withBtn;b.hidden=false;if(!viewTouched)fit();}
function hideInstall(){var b=$('#install');if(b){b.hidden=true;if(!viewTouched)fit();}}
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredInstall=e;
  if(!installDismissed()&&!isStandalone())showInstall('Instala Plano CCTV en este equipo para abrirlo como una app, incluso sin internet.',true);
});
window.addEventListener('appinstalled',function(){deferredInstall=null;hideInstall();toast('Plano CCTV instalado.',4000);});
$('#install-go').addEventListener('click',function(){
  if(!deferredInstall)return;
  var ev=deferredInstall;deferredInstall=null;hideInstall();
  try{ev.prompt();}catch(e){}
});
$('#install-no').addEventListener('click',function(){hideInstall();try{localStorage.setItem(INSTALL_KEY,String(Date.now()));}catch(e){}});
if(/iphone|ipad|ipod/i.test(navigator.userAgent||'')&&!isStandalone()&&!installDismissed()){
  showInstall('Para instalarla en este equipo: toca Compartir y luego «Agregar a pantalla de inicio».',false);
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){try{navigator.serviceWorker.register('./sw.js').catch(function(){});}catch(e){}});
}
/*PWA-FIN*/

(function boot(){
  var saved=null;try{saved=load();}catch(e){loadDamaged=true;}
  if(saved){state=saved;if(!state.settings)state.settings={recMode:'igual',recPx:1920,night:false,bands:4,showLen:true};try{localStorage.setItem(KEY+'-abriendo','1');guardOn=true;}catch(e){}}
  else exampleState();
  $('#banner').hidden=!state.example;
  $('#pname').value=state.name||'';
  if(bgSrc&&state.bg){var im=new Image();im.onload=function(){bgImg=im;redraw();};im.src=bgSrc;}
  renderPanel();updUndo();resize();
  renderLegend();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearGuard();if(dirty)saveNow();}});
  window.addEventListener('pagehide',function(){clearGuard();if(dirty)saveNow();});
  if(loadDamaged)toast('El plano guardado estaba dañado. Guardé una copia aparte y abrí el ejemplo.',8000);
  else if(backupFailed)toast('Actualicé el formato de tu plano pero no pude dejar copia del original. Guarda ahora un archivo .json (botón Proyecto).',10000);
  else if(migratedV1)toast('Actualicé el formato de tu plano y dejé una copia del original. Guarda también un archivo .json (botón Proyecto) como respaldo.',9000);
  else if(lastDropped>0)toast('Se omitieron '+lastDropped+' elementos dañados al abrir el plano.',6000);
  window.__cctv={get state(){return state;},histLen:function(){return hist.length;},camModel:camModel,cellLevel:cellLevel,sanitize:sanitizeState,viewRange:viewRange,targetH:targetH,bandsFor:bandsFor,levelDist:levelDist,view:view,setTool:setTool,fit:fit,coverageRaster:coverageRaster,setView:setView};
})();
})();

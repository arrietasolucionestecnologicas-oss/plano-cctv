  if(d[0]>=3)it.push('<b>Puertas y accesos:</b> identifica rostros hasta '+fmt(d[0],1)+' m.');
  else it.push('Para identificar un rostro la persona debe estar a menos de '+fmt(d[0],1)+' m: solo sirve en puntos muy cercanos.');
  if(d[1]>=5)it.push('<b>Salones, pasillos y tiendas:</b> reconoce personas hasta '+fmt(d[1],1)+' m.');
  else it.push('No es la mejor opción para salones grandes: reconoce personas solo hasta '+fmt(d[1],1)+' m.');
  if(d[2]>=12)it.push('<b>Patios, parqueaderos y fachadas:</b> permite ver qué hace cada persona hasta '+fmt(d[2],1)+' m.');
  if(d[3]>=30)it.push('<b>Áreas abiertas y perímetros:</b> detecta que hay alguien hasta '+fmt(d[3],1)+' m (no alcanza para identificar).');
  else if(d[3]<15)it.push('No sirve para áreas abiertas grandes: detecta presencia solo hasta '+fmt(d[3],1)+' m.');
  if(k.vari)it.push('<b>Varifocal:</b> el ángulo se ajusta a mano, útil cuando aún no sabes a qué distancia queda lo que quieres ver.');
  else if(c.hfov>=100)it.push('<b>Gran angular ('+fmt(c.hfov,0)+'°):</b> cubre mucho ancho desde una esquina, pero las personas lejanas se ven pequeñas.');
  else if(c.hfov<=65)it.push('<b>Ángulo cerrado ('+fmt(c.hfov,0)+'°):</b> ideal para un pasillo, portón o acceso; no para cubrir un salón completo.');
  else it.push('<b>Ángulo medio ('+fmt(c.hfov,0)+'°):</b> equilibrio entre ancho y alcance.');
  it.push('<b>De noche:</b> infrarrojo nominal hasta '+fmt(c.ir,0)+' m'+(/luz dual/i.test(k.kind||'')?' y luz cálida para ver a color':'')+' (dato de ficha; el alcance real se valida en sitio).');
  if(/^bala/i.test(k.kind||''))it.push('<b>Tipo bala:</b> se nota y disuade; es la forma que más se usa en exteriores. Confirma su protección contra agua (IP) en la ficha.');
  else if(/torreta|domo|eyeball/i.test(k.kind||''))it.push('<b>Tipo torreta o domo:</b> más discreta y compacta; revisa su protección (IP) en la ficha si va al exterior.');
  var pb=planBox();
  if(pb){
    it.push('<b>En tu plano</b> ('+fmt(pb.w,1)+' × '+fmt(pb.h,1)+' m, diagonal '+fmt(pb.diag,1)+' m): '+((d[1]>=pb.diag&&c.hfov>=90)?'una sola cámara en una esquina alcanza a reconocer personas en todo el espacio, si nada tapa la vista.':'desde una esquina reconoce hasta '+fmt(d[1],1)+' m; para todo el espacio hacen falta más cámaras. Mira «Sugerencia de cámaras» en Proyecto.'));
  }
  return '<div class="uso"><p class="note"><b>Para qué puede servir</b> (según las distancias calculadas de este lente):</p><ul><li>'+it.join('</li><li>')+'</li></ul><p class="note">Criterio general del programa, no una promesa: confirma en campo.</p></div>';
}
var sugTarget=1,sugResult=null;
function sugKey(){return JSON.stringify([state.walls.map(function(w){return [w.a.x,w.a.y,w.b.x,w.b.y];}),sugTarget,state.settings.recMode,state.settings.recPx,state.settings.night]);}
function sugVariants(){
  var out=[];
  CATALOG.forEach(function(k){
    if(k.id==='custom')return;
    if(k.vari)[100,60,35].forEach(function(hf){out.push({k:k,lens:null,hfov:hf,label:'zoom a '+hf+'°'});});
    else k.lenses.forEach(function(l,i){out.push({k:k,lens:i,hfov:l.hfov,label:'lente de '+l.label});});
  });
  return out;
}
/* Prueba posiciones sobre el contorno del espacio (esquinas y lados), apuntando al centro, y va sumando la cámara que más cubre
   hasta llegar al 90 % del espacio con la calidad pedida (máximo 5 cámaras). Usa el mismo motor del plano: las paredes tapan la vista. */
function suggest(target){
  var pb=planBox();if(!pb)return null;
  var step=Math.max(0.25,Math.max(pb.w,pb.h)/60),nx=Math.max(2,Math.round(pb.w/step)),ny=Math.max(2,Math.round(pb.h/step));
  var cells=[],i,j,t;
  for(j=0;j<ny;j++)for(i=0;i<nx;i++)cells.push([pb.x0+(i+.5)*pb.w/nx,pb.y0+(j+.5)*pb.h/ny]);
  var cx=pb.x0+pb.w/2,cy=pb.y0+pb.h/2,ins=Math.min(0.35,pb.w/4,pb.h/4);
  var X0=pb.x0+ins,X1=pb.x1-ins,Y0=pb.y0+ins,Y1=pb.y1-ins,pos=[];
  for(t=0;t<=4;t++){pos.push([X0+(X1-X0)*t/4,Y0]);pos.push([X0+(X1-X0)*t/4,Y1]);}
  for(t=1;t<=3;t++){pos.push([X0,Y0+(Y1-Y0)*t/4]);pos.push([X1,Y0+(Y1-Y0)*t/4]);}
  var variants=sugVariants().map(function(v){
    var k=v.k,cov=pos.map(function(p){
      var dir=deg(Math.atan2(cy-p[1],cx-p[0]));
      var c={id:'s',name:'S',cat:k.id,x:p[0],y:p[1],dir:dir,px:k.px,ir:k.ir,lens:v.lens,hfov:v.hfov,h:null,tilt:null,vfov:null,vfovAuto:false};
      var m=camModel(c,4),set=new Uint8Array(cells.length),q,lv;
      for(q=0;q<cells.length;q++){lv=cellLevel(m,cells[q][0],cells[q][1]);if(lv>=0&&lv<=target)set[q]=1;}
      return {x:p[0],y:p[1],dir:dir,set:set};
    });
    var got=new Uint8Array(cells.length),picks=[],steps=[],cnt=0,n,q;
    for(n=1;n<=5;n++){
      var bi=-1,bg=0;
      cov.forEach(function(c,ix){var g=0,z;for(z=0;z<cells.length;z++)if(c.set[z]&&!got[z])g++;if(g>bg){bg=g;bi=ix;}});
      if(bi<0)break;
      for(q=0;q<cells.length;q++)if(cov[bi].set[q])got[q]=1;
      cnt+=bg;picks.push(cov[bi]);steps.push(cnt/cells.length);
      if(cnt/cells.length>=0.9)break;
    }
    var vp=ventaDe(k),cov1=steps.length?steps[steps.length-1]:0;
    return {k:k,lens:v.lens,hfov:v.hfov,label:v.label,n:picks.length,coverage:cov1,firstCoverage:steps.length?steps[0]:0,ok:cov1>=0.9,
      placements:picks.map(function(p){return {x:p.x,y:p.y,dir:p.dir};}),price:vp==null?null:vp*picks.length};
  });
  variants.sort(function(a,b){
    if(a.ok!==b.ok)return a.ok?-1:1;
    if(a.ok)return (a.n-b.n)||((a.price==null?1e12:a.price)-(b.price==null?1e12:b.price));
    return b.coverage-a.coverage;
  });
  return {pb:pb,target:target,grid:{x0:pb.x0,y0:pb.y0,w:pb.w,h:pb.h,nx:nx,ny:ny},variants:variants};
}
function runSuggest(){

  }else if(sugResult)h+='<p class="note">El plano o los ajustes cambiaron: calcula de nuevo.</p>';
  return h;

function fotoProcesar(file,catId,listo){
  if(!file||String(file.type||'').indexOf('image/')!==0){toast('Elige una imagen.');return;}
  var rd=new FileReader();
  rd.onerror=function(){toast('No se pudo leer la foto.');};
  rd.onload=function(){
    var im=new Image();
    im.onerror=function(){toast('No se pudo abrir esa imagen.');};
    im.onload=function(){
      var m=240,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));

      var url=c.toDataURL('image/jpeg',0.72);
      if(fotoGuardar(catId,url)){toast('Foto guardada.');listo&&listo();}
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* Trozo del código de la página entre dos marcas (se concatena para no escribir las marcas completas aquí). */
function bloqueCodigo(t,n){var a=t.indexOf('/*'+n+'-INI*/'),f='/*'+n+'-FIN*/',b=t.indexOf(f);return (a>=0&&b>a)?t.slice(a,b+f.length):'';}
function fuenteMotor(){
  var t=Array.prototype.map.call(document.scripts,function(x){return x.textContent;}).join('\n');
  var src=bloqueCodigo(t,'NUCLEO')+'\n'+bloqueCodigo(t,'GEOM')+'\n'+bloqueCodigo(t,'MOTOR');
  return (src.indexOf('var MOTOR')>=0&&src.indexOf('var GEOM')>=0&&src.indexOf('var NUCLEO')>=0)?src+'\n;onmessage=function(e){var j=MOTOR.crear(e.data),r;do{r=j.paso(40);postMessage({p:r.progreso});}while(!r.listo);postMessage({fin:j.resultado()});};':'';
}
/* Se calcula en segundo plano (un Worker) para que la pantalla no se trabe; si el navegador no lo permite, se hace por tramos en la página. */
function correrMotor(ent,onProg,onFin){
  var src='',w=null,terminado=false;
  var local=function(){
    var job=MOTOR.crear(ent);
    var tick=function(){if(terminado||da.cancelado)return;var r=job.paso(30);onProg(r.progreso);if(r.listo){terminado=true;onFin(job.resultado());}else setTimeout(tick,0);};
    setTimeout(tick,0);
  };
  try{src=fuenteMotor();}catch(e){src='';}
  if(src&&window.Worker){
    try{
      var u=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
      w=new Worker(u);da.w=w;
      w.onmessage=function(e){if(terminado||da.cancelado)return;if(e.data&&e.data.fin){terminado=true;try{w.terminate();URL.revokeObjectURL(u);}catch(_){}onFin(e.data.fin);}else if(e.data&&typeof e.data.p==='number')onProg(e.data.p);};
      w.onerror=function(){if(terminado)return;try{w.terminate();}catch(_){}w=null;da.w=null;local();};
      w.postMessage(ent);
      return;
    }catch(e){w=null;}
  }
  local();
}

/* ---------- Borrar ---------- */
function segInter(a,b,c,d){
  var d1=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x),d2=(b.x-a.x)*(d.y-a.y)-(b.y-a.y)*(d.x-a.x);
  var d3=(d.x-c.x)*(a.y-c.y)-(d.y-c.y)*(a.x-c.x),d4=(d.x-c.x)*(b.y-c.y)-(d.y-c.y)*(b.x-c.x);
  return ((d1>0)!==(d2>0))&&((d3>0)!==(d4>0));
}
function segHitsRect(p,q,r){
  var ins=function(pt){return pt.x>=r.x0&&pt.x<=r.x1&&pt.y>=r.y0&&pt.y<=r.y1;};
  if(ins(p)||ins(q))return true;
  var E=[[{x:r.x0,y:r.y0},{x:r.x1,y:r.y0}],[{x:r.x1,y:r.y0},{x:r.x1,y:r.y1}],[{x:r.x1,y:r.y1},{x:r.x0,y:r.y1}],[{x:r.x0,y:r.y1},{x:r.x0,y:r.y0}]];
  for(var i=0;i<4;i++)if(segInter(p,q,E[i][0],E[i][1]))return true;
  return false;
}
function boxOf(a){return {x0:Math.min(a.a.x,a.b.x),y0:Math.min(a.a.y,a.b.y),x1:Math.max(a.a.x,a.b.x),y1:Math.max(a.a.y,a.b.y)};}
function wallsInBox(a){var r=boxOf(a);return state.walls.filter(function(w){return segHitsRect(w.a,w.b,r);});}
function camsInBox(a){var r=boxOf(a);return state.cams.filter(function(c){return c.x>=r.x0&&c.x<=r.x1&&c.y>=r.y0&&c.y<=r.y1;});}
/* Borra lo que haya bajo el dedo (paredes a menos de 18 px; cámaras solo si se activó). Un gesto = un solo paso de deshacer. */
function eraseAt(a,p){
  var wp=s2w(p.x,p.y),tol=18/view.s;
  var cm=eraseCams?hitCam(p):null;
  /* Una cámara suele ir montada sobre una pared: si se borran cámaras y el dedo está sobre una, se borra solo la cámara. */
  var ws=cm?[]:state.walls.filter(function(w){return distSeg(wp,w.a,w.b)<tol;});
  if(!ws.length&&!cm)return;
  commitPre(a);
  if(ws.length){var ids={};ws.forEach(function(w){ids[w.id]=1;});state.walls=state.walls.filter(function(w){return !ids[w.id];});}
  if(cm)state.cams=state.cams.filter(function(c){return c.id!==cm.id;});
  a.removed+=ws.length+(cm?1:0);
  if(sel&&((sel.type==='wall'&&!wallById(sel.id))||(sel.type==='cam'&&!camById(sel.id))))sel=null;
  redraw();
}
function eraseSweep(a,p){
  eraseHover=p;
  var q=a.prev||p,d=Math.hypot(p.x-q.x,p.y-q.y),n=Math.max(1,Math.ceil(d/6));
  for(var i=1;i<=n;i++)eraseAt(a,{x:q.x+(p.x-q.x)*i/n,y:q.y+(p.y-q.y)*i/n});
  a.prev=p;redraw();
}

panel.addEventListener('change',function(e){
  if(e.target&&e.target.id==='foto-in'){fotoProcesar(e.target.files&&e.target.files[0],e.target.dataset.cat,function(){renderPanel();});e.target.value='';return;}
  if(elemPanelChange(e))return;
  var id=e.target.id,c=sel&&sel.type==='cam'?camById(sel.id):null;
  if(id==='e-cams'){eraseCams=e.target.checked;return;}
  if(id==='c-model'){curModel=e.target.value;curLens=0;renderPanel();return;}
  if(id==='c-lens'){curLens=parseInt(e.target.value,10)||0;renderPanel();return;}
  if(c){
    if(id==='f-model'){pushHist();c.cat=e.target.value;var k=CAT(c.cat);c.px=k.px;c.ir=k.ir;applyLens(c,0);afterChange();renderPanel();return;}
    if(id==='f-lens'){pushHist();applyLens(c,parseInt(e.target.value,10)||0);afterChange();renderPanel();return;}
    if(/^f-/.test(id)){afterChange();renderPanel();return;}
  }
  if(id==='w-len'&&sel&&sel.type==='wall'){
    var w=wallById(sel.id),L=parseFloat(e.target.value);
    if(w&&L>=0.05){
      pushHist();
      var dx=w.b.x-w.a.x,dy=w.b.y-w.a.y,cur=Math.hypot(dx,dy)||1;
      w.b={x:w.a.x+dx/cur*L,y:w.a.y+dy/cur*L};afterChange();renderPanel();

});
panel.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(elemPanelClick(t))return;

  if(id==='foto-del'){if(fotoGuardar(t.dataset.cat,null)){toast('Foto quitada.');renderPanel();}return;}
  if(t.dataset.emode){eraseMode=t.dataset.emode;renderPanel();return;}
  if(id==='e-all-walls'){askDelete('walls');return;}
  if(id==='e-all-cams'){askDelete('cams');return;}
  if(id==='e-all'){askDelete('all');return;}
  if(id==='b-del'&&c){pushHist();state.cams=state.cams.filter(function(x){return x.id!==c.id;});sel=null;afterChange();renderPanel();}
  if(id==='b-dup'&&c){
    pushHist();var n=JSON.parse(JSON.stringify(c));n.id=uid();state.camSeq=(state.camSeq||0)+1;n.name='C'+state.camSeq;n.x+=0.6;n.y+=0.6;
    state.cams.push(n);sel={type:'cam',id:n.id};afterChange();renderPanel();
  }
  if(id==='w-del'&&sel&&sel.type==='wall'){pushHist();state.walls=state.walls.filter(function(x){return x.id!==sel.id;});sel=null;afterChange();renderPanel();}
  if(id==='calib-cancel'){calibPts=[];setTool('select');}
  if(id==='calib-ok'){
    var real=parseFloat(($('#calib-d')||{}).value);
    if(!(real>0)){toast('Escribe la distancia real en metros.');return;}
    if(!state.bg){toast('No hay plano de fondo que calibrar.');return;}
    var d=Math.hypot(calibPts[0].x-calibPts[1].x,calibPts[0].y-calibPts[1].y);
    if(d<0.05){toast('Los dos puntos están casi en el mismo lugar. Marca dos puntos separados.',5000);return;}
    var f=real/d,o=calibPts[0];
    if(!isFinite(f)||f<0.05||f>20){toast('La escala resultante no es razonable. Revisa los dos puntos y la distancia escrita.',6000);return;}
    if(state.bg){pushHist();state.bg.w*=f;state.bg.h*=f;state.bg.x=o.x+(state.bg.x-o.x)*f;state.bg.y=o.y+(state.bg.y-o.y)*f;}
    calibPts=[];setTool('select');afterChange();fit();toast('Escala aplicada.');
  }
});

document.addEventListener('keydown',function(e){
  var tg=(e.target.tagName||'').toLowerCase();
  if(tg==='input'||tg==='select'||tg==='textarea')return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&(e.key==='z'||e.key==='Z')))){e.preventDefault();rehacer();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    var k=(e.key||'').toLowerCase();
    if(k==='escape'){if(!modal.hidden)closeModal();else if(tool==='calib'){calibPts=[];setTool('select');}else if(sel)selectItem(null);return;}
    if(!modal.hidden)return;
    var tm={v:'select',w:'wall',e:'elem',c:'cam',m:'measure',b:'erase'};
    if(tm[k]){setTool(tm[k]);return;}
    if(k==='p'){openProject();return;}
    if(k==='+'||k==='='){zoomAt(1.3);return;}
    if(k==='-'){zoomAt(1/1.3);return;}
    if(k==='f'){fit();return;}
  }
  if((e.key==='Delete'||e.key==='Backspace')&&sel)borrarSeleccion();
});

async function saveBlob(blob,filename){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:filename,data:blob});return true;}
  }catch(err){if(err&&err.code==='declined')return false;}
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
  return true;
}

function copyText(t,msg){

function importText(txt){
  if(typeof txt!=='string'||!txt.trim()){toast('No hay nada que abrir.');return;}
  if(txt.length>MAX_FILE){toast('El archivo es demasiado grande para abrirlo.',6000);return;}
  var o=null;try{o=JSON.parse(txt);}catch(e){}
  if(o&&o.tipo==='biblioteca'){importarBiblioteca(o);return;}
  var s2=sanitizeState(o&&(o.state||o));
  if(!s2){toast('El archivo no es un proyecto válido de Plano CCTV.',5000);return;}
  var dropped=lastDropped,src=validBgSrc(o&&o.bgSrc),newer=!!(o&&o.version>FORMAT);
  pushHist();
  state=s2;state.example=false;bgSrc=src;if(!src)state.bg=null;loadBg(src);
  sel=null;calibPts=[];$('#banner').hidden=true;$('#pname').value=state.name||'';
  rotuloPlanta();closeModal();afterChange(true);renderPanel();
  toast('Proyecto abierto'+(dropped?' (se omitieron '+dropped+' elementos dañados o sobrantes)':'')+(newer?'. Venía de una versión más nueva: se abrió lo que esta versión entiende':'')+'. El anterior se recupera con Deshacer.',7000);
}

$('#file-bg').addEventListener('change',function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=1600,k=Math.min(1,mx/Math.max(im.width,im.height)),cvx=document.createElement('canvas');
      cvx.width=Math.round(im.width*k);cvx.height=Math.round(im.height*k);
      cvx.getContext('2d').drawImage(im,0,0,cvx.width,cvx.height);
      var src;try{src=cvx.toDataURL('image/jpeg',0.78);}catch(_){toast('No pude leer la imagen.');return;}
      pushHist();
      var img2=new Image();img2.onload=function(){
        bgImg=img2;bgSrc=src;
        state.bg={x:0,y:0,w:20,h:20*cvx.height/cvx.width,opacity:0.6};
        afterChange();fit();closeModal();toast('Plano cargado. Calibra la escala en Proyecto.');
      };img2.src=src;
    };
    im.onerror=function(){toast('Ese archivo no es una imagen válida.');};
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
});

function doExport(){
  var b=contentBounds(true),mg=1.2,bw=(b.x1-b.x0)+2*mg,bh=(b.y1-b.y0)+2*mg;
  var outW=1800,pad=60,planW=outW-2*pad,s=planW/bw,planH=bh*s;
  if(planH>1500){s=1500/bh;planH=1500;planW=bw*s;}
  var rows=state.cams.length,headerH=130,tableH=rows?(60+rows*34):0,legendH=175;
  var outH=Math.round(headerH+planH+tableH+legendH+pad);
  var cvx=document.createElement('canvas');cvx.width=outW;cvx.height=outH;
  var c=cvx.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,outW,outH);
  c.fillStyle=PRINT.text;c.textBaseline='alphabetic';c.textAlign='left';
  c.font="600 40px 'Space Grotesk',"+FONT;c.fillText(state.name||'Plano CCTV',pad,70);
  c.font='500 20px '+FONT;c.fillStyle='#556577';
  c.fillText('Arrieta Soluciones Técnicas (A.S.T.)  ·  '+new Date().toLocaleDateString('es-CO'),pad,102);
  var px0=pad+(outW-2*pad-planW)/2,py0=headerH;
  c.save();c.translate(px0,py0);c.beginPath();c.rect(0,0,planW,planH);c.clip();
  var v={s:s,ox:(-b.x0+mg)*s,oy:(-b.y0+mg)*s};
  drawScene(c,v,PRINT,{W:planW,H:planH,grid:true,labels:true,ui:false,fs:16});
  c.restore();
  c.strokeStyle=PRINT.line;c.lineWidth=2;c.strokeRect(px0,py0,planW,planH);
  var y=py0+planH+50;
  if(rows){
    c.fillStyle=PRINT.text;c.font="600 22px 'Space Grotesk',"+FONT;c.fillText('Cámaras (distancias calculadas, no de ficha)',pad,y);y+=34;
    c.font='500 17px '+FONT;
    state.cams.forEach(function(cam){
      var k=CAT(cam.cat),ln=(cam.lens!=null&&k.lenses[cam.lens])?k.lenses[cam.lens].label+' ':'';
      var ds=[];for(var i=0;i<nBands();i++)ds.push(LEVELS[i].name.slice(0,3)+'. '+fmt(levelDist(cam,LEVELS[i].ppm),1)+' m');
      c.fillStyle=PRINT.cam;c.fillText(cam.name,pad,y);
      c.fillStyle=PRINT.text;
      c.fillText(k.name+'  '+ln+'('+fmt(cam.hfov,0)+'°, '+effPx(cam)+' px)',pad+80,y);
      c.fillText(ds.join('   '),pad+800,y);
      y+=34;
    });
    y+=26;
  }
  c.fillStyle=PRINT.text;c.font="600 22px 'Space Grotesk',"+FONT;c.fillText('Niveles de calidad: '+perfilActivo().nombre+', '+perfilActivo().norma,pad,y);y+=16;
  var x=pad;
  if(viewMode()==='count'){
    legendItems().forEach(function(it){
      c.fillStyle=it.col;c.globalAlpha=.55;c.fillRect(x,y+4,26,26);c.globalAlpha=1;
      c.fillStyle=PRINT.text;c.font='500 18px '+FONT;c.fillText(it.t,x+36,y+24);x+=330;
    });
  }else for(var i=0;i<nBands();i++){
    var lv=LEVELS[i];c.fillStyle=lv.col;c.globalAlpha=.55;c.fillRect(x,y+4,26,26);c.globalAlpha=1;
    c.fillStyle=PRINT.text;c.font='500 18px '+FONT;c.fillText(lv.name+' ('+fmt(lv.ppm,1)+' píx/m)',x+36,y+24);x+=330;
  }
  y+=60;
  c.font='500 15px '+FONT;c.fillStyle='#556577';
  c.fillText((state.cams.length&&state.cams.every(is3D)?'Cobertura estimada en 3D hacia un objetivo a '+fmt(targetH(),2)+' m; paredes como obstáculos de altura completa. ':state.cams.some(is3D)?'Cobertura estimada: '+state.cams.filter(is3D).length+' de '+state.cams.length+' cámaras en 3D (con altura), el resto en 2D sin altura ni inclinación. ':'Cobertura estimada en 2D, frente a la cámara, sin altura ni inclinación. ')+(state.settings.night?'Condición: noche (limitado al alcance IR nominal de ficha, sin validar en sitio). ':'Condición: día. ')+'Grabador: '+(state.settings.recMode==='igual'?'sin límite':state.settings.recPx+' px')+'.',pad,y);
  var conP=state.cams.filter(function(q){return pendientes(q).length;}).map(function(q){return q.name;});
  if(conP.length){y+=22;c.fillText('* Usan algún dato técnico por confirmar: '+conP.slice(0,24).join(', ')+(conP.length>24?' y otras':'')+'. Simulación estimada, no es garantía de desempeño.',pad,y);}
  cvx.toBlob(function(blob){
    if(!blob){toast('No pude crear la imagen.');return;}
    var url=URL.createObjectURL(blob);
    mbody.innerHTML='<img class="prev" src="'+url+'" alt="Vista previa del plano exportado"><p class="note">Si el botón no guarda, mantén presionada la imagen para guardarla.</p><div class="row"><button class="btn pri" id="x-save">Guardar PNG</button></div>';
    $('#m-title').textContent='Imagen del plano';modal.hidden=false;
    $('#x-save').addEventListener('click',async function(){
      try{
        var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
        if(!dl){
          var a=document.createElement('a');a.href=url;a.download='plano-cctv.png';document.body.appendChild(a);a.click();document.body.removeChild(a);
          toast('Imagen descargada. Si no aparece, mantén presionada la imagen.');return;
        }
        await dl.save({filename:'plano-cctv.png',data:blob});toast('Imagen guardada.');
      }catch(err){if(!err||err.code!=='declined')toast('No se pudo guardar. Mantén presionada la imagen.');}
    });
  },'image/png');
}
